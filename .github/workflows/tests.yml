name: Forge tests
on:
  push:
    branches: [main, 'feature/**', 'release/v0.18-preview.2']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: forge-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-validator.txt
      - run: python -B -m unittest discover -s tests -v
      - run: python -B forge_validate.py examples/portable-candidate/blueprint.json --baseline examples/portable-candidate/baseline.example.json
      - run: python -B forge_handoff.py verify examples/uncertain-order examples/uncertain-order/handoff-manifest.json
      - run: python -B forge.py pack --ref HEAD --output "$RUNNER_TEMP/engineering-forge.zip"
      - run: python -B forge.py progress examples/progress-ledger.json --revision synthetic-r1
      - run: python -B forge.py records . fixtures/project.json
      - run: python -B -m unittest discover -s examples/calibration-trim -v

  publish-preview:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/v0.18-preview.2' && github.repository == '708san/engineering-forge'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Build and check preview package
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -B forge.py pack --ref "$GITHUB_SHA" --output "$RUNNER_TEMP/engineering-forge-v0.18.0-preview.2.zip"
          python -m zipfile -t "$RUNNER_TEMP/engineering-forge-v0.18.0-preview.2.zip"
          cd "$RUNNER_TEMP"
          sha256sum engineering-forge-v0.18.0-preview.2.zip > SHA256SUMS.txt
      - name: Publish the fixed preview (never overwrite an existing tag)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=v0.18.0-preview.2
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/$tag" || status=$?
          test "$status" = 2
          gh release create "$tag" "$RUNNER_TEMP/engineering-forge-v0.18.0-preview.2.zip" "$RUNNER_TEMP/SHA256SUMS.txt" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false --title "Engineering Forge v0.18.0-preview.2" --notes-file RELEASE.md
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,tagName,isPrerelease,isDraft,assets,targetCommitish
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)" = "$GITHUB_SHA"
